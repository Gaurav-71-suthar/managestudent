<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
            rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>


<body>


<!-- ================================================= -->
<!-- SIDEBAR -->
<!-- ================================================= -->

<div th:fragment="sidebar"
     class="bg-dark text-white"
     id="sidebar-wrapper">

    <div class="sidebar-heading border-bottom border-secondary p-3">

        <i class="bi bi-mortarboard-fill me-2"></i>

        SMS Admin

    </div>


    <div class="list-group list-group-flush">

        <!-- Dashboard -->

        <a th:href="@{/dashboard}"
           class="sidebar-link list-group-item
                  list-group-item-action bg-dark text-white">

            <i class="bi bi-speedometer2 me-2"></i>

            Dashboard

        </a>


        <!-- Courses -->

        <a th:href="@{/course/list}"
           class="sidebar-link list-group-item
                  list-group-item-action bg-dark text-white">

            <i class="bi bi-book me-2"></i>

            Courses

        </a>


        <!-- Students -->

        <a th:href="@{/students/list}"
           class="sidebar-link list-group-item
                  list-group-item-action bg-dark text-white">

            <i class="bi bi-people me-2"></i>

            Students

        </a>
        <a th:href="@{/enrollments/enrollmentList}" class="sidebar-link ">
            <i class="bi bi-check-2-square"></i>Enrolled Students
        </a>

        <a th:href="@{/enrollments/showEnroll}" class="sidebar-link ">
            <i class="bi bi-check-2-square"></i>Enroll to Course
        </a>


        <!-- Logout -->

        <form th:action="@{/logout}"
              method="post">

            <button type="submit"
                    class="sidebar-link list-group-item
                           list-group-item-action
                           bg-dark text-white border-0">

                <i class="bi bi-box-arrow-right me-2"></i>

                Logout

            </button>

        </form>

    </div>

</div>


<!-- ================================================= -->
<!-- NAVBAR -->
<!-- ================================================= -->

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-light bg-light border-bottom">

    <div class="container-fluid">

        <!-- Sidebar Toggle -->

        <button type="button"
                class="btn btn-outline-secondary"
                id="sidebarToggle">

            <i class="bi bi-list"></i>

        </button>


        <!-- User -->

        <div class="ms-auto">

            <span class="navbar-text">

                <i class="bi bi-person-circle me-1"></i>

                Admin User

            </span>

        </div>

    </div>

</nav>


<!-- ================================================= -->
<!-- FOOTER -->
<!-- ================================================= -->

<footer th:fragment="footer"
        class="py-4 bg-light mt-auto border-top">

    <div class="container-fluid px-4">

        <div class="d-flex
                    align-items-center
                    justify-content-between
                    small">

            <div class="text-muted">

                Copyright &copy;
                Student Management System

            </div>


            <div>

                <a href="#">
                    Privacy Policy
                </a>

                &middot;

                <a href="#">
                    Terms &amp; Conditions
                </a>

            </div>

        </div>

    </div>

</footer>


<!-- ================================================= -->
<!-- JAVASCRIPT -->
<!-- ================================================= -->

<th:block th:fragment="script">

    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>


    <script>

        window.addEventListener('DOMContentLoaded', event => {

            const sidebarToggle =
                document.body.querySelector('#sidebarToggle');

            if (sidebarToggle) {

                sidebarToggle.addEventListener('click', event => {

                    event.preventDefault();

                    document.body.classList.toggle(
                        'sb-sidenav-toggled'
                    );

                });

            }

        });

    </script>

</th:block>


</body>

</html>
